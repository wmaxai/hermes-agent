# Woodpecker CI —— hermes-agent（wmaxai fork，stable 部署线）
#
# 定位：只做【生产镜像发布】。不跑单测：本项目测试需要完整依赖树与 16 profile
#      运行环境，不适合 CI；构建镜像本身（uv sync 8 个 extra + npm + Playwright
#      Chromium + web/ui-tui 前端构建）已是最强的一致性校验。
#
# 触发：仅 stable 分支手动 Run（event=manual；branch=stable，其它分支/事件匹配不到）
# 产出：registry.group.wmaxai.team/hermes-agent，tag 二选一（不是叠加别名）：
#         stable-<commit 短 id>-<版本>   ← 版本取工作区 pyproject.toml 的 project.version
#         stable-<commit 短 id>          ← 取不到版本时退化
#       ⚠️ 为什么不只打 stable-<版本>（或裸 stable）：k8s 用 tag 引用 + imagePullPolicy，
#          同名 tag 即"最新内容"；同一版本号二次构建会在 Pod 重启时静默换掉内容。
#          带 sha 的 tag 才与内容一一对应，回滚也说得清是哪一版（与 fns 同规则）。
# 部署：不做自动部署。推送成功后人工取 digest 更新 k3s（与 fns 同流程）：
#       kubectl -n <ns> set image deploy/<hermes 部署名> \
#         hermes=registry.group.wmaxai.team/hermes-agent@sha256:<digest>
# 凭据：registry_username / registry_password（Woodpecker wmaxai 组织级 Secrets，与 fns 共用）
#
# ⚠️ 两个前置条件在 Woodpecker UI 侧，不在本文件里：
#   1. 项目 Timeout 调到 120 分钟（默认 60m）——本镜像构建很重：SQLite 源码编译
#      + uv sync（all/messaging/otlp/anthropic/bedrock/azure/hindsight/matrix）
#      + npm + Playwright Chromium + 前端构建。官方 CI 15–45 分钟，2C4G 自建
#      runner 40–70 分钟。（上限受 server 端 WOODPECKER_MAX_PIPELINE_TIMEOUT
#      约束，默认 120m —— 若被拒，需先在 server 侧调大。）
#   2. 组织 Secrets 里已有 registry_username / registry_password
#
# 镜像 provenance：Dockerfile 的 ARG HERMES_GIT_SHA 会写入
# /opt/hermes/.hermes_build_sha 与 /etc/hermes/image-provenance.json。
# .dockerignore 排除了 .git，所以不传这个 arg 的话镜像里 `hermes dump` 只会显示
# unknown，出问题无法定位是哪个 commit 构建的——故必须传。

when:
  event: manual
  branch: stable

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      # 版本号从工作区的 pyproject.toml 读（git tag/history 都不需要），provenance 走
      # HERMES_GIT_SHA build-arg，镜像构建不需要历史：本仓库 .git 有 1.2G，depth 1
      # 省掉全量 clone（fns 那边为了 git describe 取版本才要 tags + depth 0）。
      depth: 1

steps:
  # 生成镜像 tag 到工作区 .tags，下一步 tags_file 读取。与 fns 同规则：tag 必带 sha，
  # 版本只做可读性后缀；命令用 cut 而不是 ${VAR:0:8}，不依赖具体 /bin/sh 实现。
  - name: version-tag
    image: alpine:3.20
    commands:
      - VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' pyproject.toml | head -1)
      - SHA8=$(printf '%s' "$CI_COMMIT_SHA" | cut -c1-8)
      - TAG="stable-${SHA8}${VERSION:+-$VERSION}"
      - echo "$TAG" > .tags
      - cat .tags

  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx:2
    # Woodpecker 3.x 起 plugin-docker-buildx 不再默认特权：linter 会直接拒绝
    # 未声明 privileged 的 docker-buildx step（除非 server 的
    # WOODPECKER_PLUGINS_PRIVILEGED 白名单里含该镜像）。显式声明后
    # ① 配置校验通过 ② 插件才能以内置 dockerd 的特权模式启动。
    privileged: true
    settings:
      registry: https://registry.group.wmaxai.team
      repo: registry.group.wmaxai.team/hermes-agent
      dockerfile: Dockerfile
      # tags_file 覆盖 tags：读取上一步写在工作区的 .tags（多行=多 tag）
      tags_file: .tags
      # 构建缓存：plugin-docker-buildx 每次跑在一次性容器里，本地 cache 随容器销毁，
      # 不导出的话每次都全量重建（SQLite 编译 + uv sync + npm + Chromium + 前端 = 40–70min）。
      # 这里把缓存作为 registry 里的一个镜像存取（等价写法：cache_images: [<同一 ref>]，
      # 插件会展开成本处的 cache_from/cache_to）。mode=max 才缓存多阶段的所有层；
      # image-manifest/oci-mediatypes 是官方对 Harbor 这类 registry 的兼容建议。
      # ⚠️ :buildcache 只是缓存，不可用于部署；部署仍用 stable-<sha8>-<版本> 或 digest。
      cache_from: "type=registry,ref=registry.group.wmaxai.team/hermes-agent:buildcache"
      cache_to: "type=registry,ref=registry.group.wmaxai.team/hermes-agent:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
      platforms: linux/amd64
      build_args:
        HERMES_GIT_SHA: "${CI_COMMIT_SHA}"
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
