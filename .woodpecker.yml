# Woodpecker CI —— hermes-agent（wmaxai fork，stable 部署线）
#
# 定位：只做【生产镜像发布】。不跑单测：本项目测试需要完整依赖树与 16 profile
#      运行环境，不适合 CI；构建镜像本身（uv sync 8 个 extra + npm + Playwright
#      Chromium + web/ui-tui 前端构建）已是最强的一致性校验。
#
# 触发：仅 stable 分支手动 Run（event=manual；branch=stable，其它分支/事件匹配不到）
# 产出：registry.group.wmaxai.team/hermes-agent，tag 二选一（不是叠加别名）：
#         stable-<commit 短 id>-<最近 git tag>   ← 例：stable-fe20004118-20260911
#         stable-<commit 短 id>                  ← 没有可达 tag 时退化
#       ⚠️ 为什么不只打 stable-<版本>（或裸 stable）：k8s 用 tag 引用 + imagePullPolicy，
#          同名 tag 即"最新内容"；同一版本号二次构建会在 Pod 重启时静默换掉内容。
#          带 sha 的 tag 才与内容一一对应，回滚也说得清是哪一版（与 fns 同规则）。
# 部署：不做自动部署。推送成功后人工取 digest 更新 k3s（与 fns 同流程）：
#       kubectl -n <ns> set image deploy/<hermes 部署名> \
#         hermes=registry.group.wmaxai.team/hermes-agent@sha256:<digest>
# 凭据：registry_username / registry_password（Woodpecker wmaxai 组织级 Secrets，与 fns 共用）
#
# ⚠️ 两个前置条件在 Woodpecker UI 侧，不在本文件里：
#   1. 项目 Timeout 调到 120 分钟（默认 60m）——本镜像构建很重：SQLite 源码编译
#      + uv sync（all/messaging/otlp/anthropic/bedrock/azure/hindsight/matrix）
#      + npm + Playwright Chromium + 前端构建。官方 CI 15–45 分钟，2C4G 自建
#      runner 40–70 分钟。（上限受 server 端 WOODPECKER_MAX_PIPELINE_TIMEOUT
#      约束，默认 120m —— 若被拒，需先在 server 侧调大。）
#   2. 组织 Secrets 里已有 registry_username / registry_password
#
# 镜像 provenance：Dockerfile 的 ARG HERMES_GIT_SHA 会写入
# /opt/hermes/.hermes_build_sha 与 /etc/hermes/image-provenance.json。
# .dockerignore 排除了 .git，所以不传这个 arg 的话镜像里 `hermes dump` 只会显示
# unknown，出问题无法定位是哪个 commit 构建的——故必须传。

when:
  event: manual
  branch: stable

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      # 与 fns 同做法：非 tag 事件默认 `git fetch --no-tags`，工作区没有 tag，
      # `git describe --tags --abbrev=0` 就取不到版本号 → tags: true 让 clone 把 tag 带回来。
      # depth: 0（全量历史）才能让 describe 回溯到最近的可达 tag；代价是本仓库 .git 约 1.3G，
      # 且 tags 一旦开启，plugin-git 的 partial 克隆也会关闭（见 plugin-git docs.md）。
      tags: true
      depth: 0

steps:
  # 算镜像 tag 并写进工作区 .tags（下一步 tags_file 读取）。
  # fns 是在它自己的 build 步骤里算的；hermes 的 build 是 buildx 插件（没有 shell），
  # 所以单列这一个只需要 git 的轻量步骤，镜像复用 clone 那一个（agent 上已拉取，无额外成本）。
  - name: version-tag
    image: woodpeckerci/plugin-git
    commands:
      # 版本 = 最近可达的 git tag（例：20260911），与 fns 完全一致的取法。
      - VERSION=$(git describe --tags --abbrev=0 2>/dev/null | tr '+' '-' || true)
      # 短 sha 与 fns 同写法：`${CI_COMMIT_SHA:0:8}` 由 Woodpecker 在【配置期】替换成值
      # （实测 drone/envsubst v1.0.3：`${CI_COMMIT_SHA:0:8}` → `abcdef12`，`:0:8` 子串语法可用）。
      - SHA8=${CI_COMMIT_SHA:0:8}
      # 兜底：配置期变量为空时（例如创建 manual pipeline 时 forge API 限流、拿不到 branch head，
      # commit sha 为空 → setNonEmptyEnvVar 会跳过该变量）从工作区 HEAD 取，clone 出来的就是本次构建的 commit。
      - '[ -n "$SHA8" ] || SHA8=$(git rev-parse HEAD | cut -c1-8)'
      # 注意：这里**不能**写 `stable-${SHA8}...`——配置期替换会把未知变量 ${SHA8} 清空；
      # 不带花括号的 $SHA8 才会留给运行时 shell（实测 drone/envsubst 只替换带花括号的变量引用；
      # 反向注意：本文件里**不要**出现字面量“美元符号+花括号”的写法，连注释里都会让替换器报
      # unable to parse variable name，整条流水线直接生成失败）。
      - 'if [ -n "$VERSION" ]; then TAG="stable-$SHA8-$VERSION"; else TAG="stable-$SHA8"; fi'
      - echo "$TAG" > .tags
      # 追加缓存 tag：本次构建产物同时推一份 <repo>:buildcache，供下次构建的 cache_from 复用
      #（插件 v2 没有 cache_to，这是经典「缓存镜像」做法；⚠️ :buildcache 只是缓存，不要用于部署）。
      - echo buildcache >> .tags
      - cat .tags
      # 诊断（可删）：`$CI_COMMIT_SHA` 不带花括号 → 看运行时环境；`${CI_COMMIT_SHA}` 花括号 →
      # 已被 Woodpecker 在配置期替换。两者都空就说明该 pipeline 没有 commit sha。
      # 注意整条要用引号包起来：命令里有「冒号+空格」，不引会被 YAML 当成 map（配置直接解析失败）。
      - 'echo "CI vars runtime_sha=[$CI_COMMIT_SHA] config_time_sha=[${CI_COMMIT_SHA}] branch=[$CI_COMMIT_BRANCH]"'

  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx:2
    # Woodpecker 3.x 起 plugin-docker-buildx 不再默认特权：linter 会直接拒绝
    # 未声明 privileged 的 docker-buildx step（除非 server 的
    # WOODPECKER_PLUGINS_PRIVILEGED 白名单里含该镜像）。显式声明后
    # ① 配置校验通过 ② 插件才能以内置 dockerd 的特权模式启动。
    privileged: true
    settings:
      registry: https://registry.group.wmaxai.team
      repo: registry.group.wmaxai.team/hermes-agent
      dockerfile: Dockerfile
      # tags_file 覆盖 tags：读取上一步写在工作区的 .tags（多行=多 tag）
      tags_file: .tags
      # 构建缓存——插件 v2 只能这么写，别再写 type=registry 那种 spec：
      # - v2 的 `cache_from` 是「镜像列表」（cli.StringSlice，会按逗号切分），只接受镜像名。写
      #   `type=registry,ref=<repo>` 会被切成 `type=registry` 和 `ref=<repo>` 两段分别传给 buildx，
      #   直接报 `ERROR: type required ... "ref=..."`（2026-09-11 那次就是这么炸的）；v2 也没有
      #   `cache_to` / `cache_images`。
      # - 所以用经典「缓存镜像」方案：这里指向 <repo>:buildcache，复用上次构建推上去的镜像层；
      #   version-tag 步骤已把 buildcache 追加进 .tags，本次构建完会再推一份新的缓存镜像。
      # - 想要 buildx 原生 registry cache（`mode=max` 缓存多阶段全部层、image-manifest/oci-mediatypes）
      #   得把插件镜像从 `:2` 升到 `:3`——v3 的 cache_from/cache_to 才是字符串、支持完整 spec。
      cache_from:
        - registry.group.wmaxai.team/hermes-agent:buildcache
      platforms: linux/amd64
      build_args:
        HERMES_GIT_SHA: "${CI_COMMIT_SHA}"
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
